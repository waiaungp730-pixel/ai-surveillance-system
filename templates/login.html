<!DOCTYPE html>
<html lang="en" class="min-h-screen bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Access · Cyber Eyes · v{{ dashboard_version }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="{{ url_for('static', filename='js/tailwindcss-browser.js') }}?v={{ dashboard_version }}"></script>
  <style>
    body {
      font-family: "JetBrains Mono", monospace;
      background: radial-gradient(ellipse at 50% 0%, rgba(0, 229, 255, 0.08), transparent 55%),
        linear-gradient(180deg, #020510 0%, #060a14 100%);
    }
    .login-panel {
      background: rgba(4, 9, 24, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.25);
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.08), inset 0 1px 0 rgba(0, 229, 255, 0.08);
      backdrop-filter: blur(14px);
    }
    .login-input {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(100, 116, 139, 0.45);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .login-input:focus {
      outline: none;
      border-color: rgba(0, 229, 255, 0.65);
      box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.15);
    }
    .login-btn {
      background: linear-gradient(90deg, rgba(0, 229, 255, 0.2), rgba(0, 255, 159, 0.15));
      border: 1px solid rgba(0, 229, 255, 0.45);
      letter-spacing: 0.12em;
    }
    .login-btn:hover {
      background: linear-gradient(90deg, rgba(0, 229, 255, 0.35), rgba(0, 255, 159, 0.28));
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.25);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="login-panel w-full max-w-md rounded-xl p-8">
    <div class="text-center mb-8">
      <p class="text-[10px] uppercase tracking-[0.35em] text-cyan-500/80 mb-2">Restricted Access</p>
      <div class="flex items-center justify-center gap-3">
        <h1 class="text-xl font-bold uppercase tracking-[0.18em] text-white" style="font-family: 'Chakra Petch', sans-serif;">
          Cyber Eyes
        </h1>
        <img
          src="{{ url_for('static', filename='images/cyber-eyes-logo.png') }}?v={{ dashboard_version }}"
          alt="Cyber Eyes"
          width="72"
          height="34"
          class="h-8 w-auto object-contain drop-shadow-[0_0_10px_rgba(34,211,238,0.45)]"
          draggable="false"
        />
      </div>
      <p class="text-[10px] text-slate-500 mt-2 uppercase tracking-widest">Authenticate to continue</p>
    </div>

    {% if error %}
    <div class="mb-5 px-3 py-2 rounded border border-rose-500/40 bg-rose-950/40 text-rose-300 text-xs text-center" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="{{ url_for('login', next=next_url) }}" class="space-y-5" autocomplete="off">
      {% if next_url %}
      <input type="hidden" name="next" value="{{ next_url }}">
      {% endif %}
      <div>
        <label for="username" class="block text-[10px] uppercase tracking-widest text-slate-400 mb-1.5">Operator ID</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          autofocus
          class="login-input w-full rounded px-3 py-2.5 text-sm text-cyan-50"
          placeholder="admin"
        >
      </div>
      <div>
        <label for="password" class="block text-[10px] uppercase tracking-widest text-slate-400 mb-1.5">Access Key</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          class="login-input w-full rounded px-3 py-2.5 text-sm text-cyan-50"
          placeholder="••••••••••••"
        >
      </div>
      <button type="submit" class="login-btn w-full py-3 rounded text-xs font-bold uppercase text-cyan-300 transition-all duration-200">
        Initialize Secure Session
      </button>
    </form>

    <p class="text-[9px] text-slate-600 text-center mt-8 uppercase tracking-wider">
      v{{ dashboard_version }} · Session encrypted
    </p>
  </div>
</body>
</html>
