# AI_Tracker NVR — real-time WebRTC front door
# :8088 → dashboard :5000 + go2rtc :1986
# (MSA_CCTV_100 :1984, MSA_CCTV :1985 — do not steal)

worker_processes  1;
error_log  logs/nvr_error.log;
pid        logs/nvr_nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 64m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream ai_tracker_dashboard {
        server 127.0.0.1:5000;
    }

    upstream go2rtc_api {
        server 127.0.0.1:1986;
    }

    server {
        listen       127.0.0.1:8088;
        server_name  _;

        location /go2rtc/ {
            proxy_pass http://go2rtc_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /api/webrtc {
            proxy_pass http://go2rtc_api/api/webrtc;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        location /api/stream.mp4 {
            proxy_pass http://go2rtc_api/api/stream.mp4;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /api/frame.jpeg {
            proxy_pass http://go2rtc_api/api/frame.jpeg;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store";
        }

        location ~ ^/snap/(cam[0-9]+)\.jpe?g$ {
            set $src $1;
            proxy_pass http://go2rtc_api/api/frame.jpeg?src=$src;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store";
        }

        location /socket.io/ {
            proxy_pass http://ai_tracker_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://ai_tracker_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }

    include nginx-snapshots.conf;
}
